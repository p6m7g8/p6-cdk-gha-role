name: Build

on:
  pull_request: {}
  workflow_dispatch: {}

  # The merge queue needs `build` to report on the queue ref. merge_group is not
  # dispatching org-wide, so mirror the push-on-queue-ref trigger the review
  # workflows already use.
  push:
    branches:
      - gh-readonly-queue/**

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    container:
      image: jsii/superchain:1-bookworm-slim-node24
    steps:
      - name: CDK Construct Build
        uses: p6m7g8-actions/cdk-construct-build@main
        with:
          aws_region: ${{ secrets.CDK_DEPLOY_REGION }}
          aws_role: ${{ secrets.AWS_ROLE }}
          aws_session_name: ${{ secrets.AWS_SESSION_NAME }}
          cdk_deploy_account: ${{ secrets.CDK_DEPLOY_ACCOUNT }}
          cdk_deploy_region: ${{ secrets.CDK_DEPLOY_REGION }}